# tests-assert-behaviour, for Python. Matches `assert <anything>.called`, the
# principle's own `bad` example: an assertion that passes when the production
# code is wrong and fails when it is merely refactored.
#
# This catches the obvious case only, which is all a pattern can: the
# principle needs judgement in general (see its source note). Not matched:
# `mock.assert_called_once_with(...)`, `assert mock.call_count == 1`. Write a
# rule per form if your tests lean on them.
id: no-assert-mock-called
principle: tests-assert-behaviour
severity: warning
matcher: ast-grep
pattern: 'assert $MOCK.called'
message: "{match} asserts that a call happened, not what the code returned or changed"
fix: "assert on the return value or the state the call produced, e.g. assert load_rates(path) == \"0.2\""
languages: [python]
exclude: []
