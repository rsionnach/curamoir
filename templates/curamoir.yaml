# cúramóir configuration.
#
# Every value below is the default, shown so you can see what cúramóir will do
# before it does it. Delete any line to keep the default; the schema is
# validated on load and errors name the offending key.

version: 1

modules:
  # How cúramóir decides what a "module" is. Modules are the unit of grading and
  # of review selection, so this is the most consequential setting here.
  #   auto            detect the importable package root (handles src/ layout)
  #                   and treat its immediate subpackages as modules
  #   top-level-dirs  one module per top-level directory
  #   explicit        only what `include` lists
  #
  # `auto` is the default because top-level-dirs collapses a src-layout repo to
  # a single module called "src", which leaves the review selector nothing to
  # choose between and flattens per-module back-off.
  strategy: auto
  include: []
  exclude:
    - build/
    - dist/
    - "*.egg-info/"
    - docs/
    # Excluded from GRADING, not from the sweep: a test suite graded as
    # production code would skew every module's grade.
    - tests/

models:
  # Verify current model ids before relying on these. cheap runs the sweep,
  # grading and the brief; deep runs r5 review escalations and rule drafting.
  cheap: claude-sonnet-5
  deep: claude-opus-5

budget:
  monthly_ceiling_usd: 15
  per_run_ceiling_usd: 2
  # pause = refuse the run; warn = proceed but record a degraded check.
  on_ceiling: pause
  # Scheduled jobs are not latency-sensitive, and the Batch API runs at 50%.
  # The largest cost lever available, at no cost in quality.
  batch: true
  # VERIFY PRICES. USD per million tokens, verified 2026-10-05. Published prices
  # change, and a stale table silently misreports spend. Cost is derived from
  # recorded tokens at read time, so correcting a price here fixes historical
  # figures without re-running any job.
  prices:
    claude-opus-5:
      input: 5.00
      output: 25.00
    claude-sonnet-5:
      input: 2.00
      output: 10.00
    claude-haiku-4-5:
      input: 1.00
      output: 5.00

cadence:
  sweep: weekly
  # Base interval. Per-module back-off doubles it for modules that keep coming
  # back clean, capped at review.backoff.max_interval.
  review: monthly
  # on_return = generate when you have been away longer than the threshold.
  brief: on_return
  smoke: weekly

review:
  # correctness and edge_cases are the defaults. clarity is opt-in; excellence
  # is opt-in AND gated on grade, so it cannot generate perpetual refactor
  # proposals against unstable code.
  lenses:
    - correctness
    - edge_cases
  excellence_min_grade: B
  modules_per_run: 2
  # Chosen uniformly at random, to counter the selector's own blind spots: a
  # selector driven only by grades never looks at a module whose grade is wrong.
  random_extra: 1
  backoff:
    clean_rounds_to_double: 2
    max_interval: quarterly

sweep:
  # You should never come back to a wall of PRs.
  max_open_prs: 3
  max_files_per_pr: 20
  # The project's test command, run before any PR (E3-R4) inside the sweep's
  # disposable clone of the base commit, with your checkout's .venv and
  # node_modules reused read-only. Run by /bin/sh, as you would type it. It
  # is read from the COMMITTED file, so commit a change here before it counts.
  # It does NOT see your shell's environment: only USER, LOGNAME, LANG, TZ,
  # LC_*, your PATH (after the reused .venv/bin and node_modules/.bin), the
  # version managers' roots (PYENV_ROOT, ASDF_DATA_DIR, ASDF_DIR, VOLTA_HOME,
  # NVM_DIR) and python3's PYTHONUSERBASE; plus a fresh, empty HOME and
  # TMPDIR, PYTHONPATH set to the clone's src then its root, CI=true and
  # PYTHONDONTWRITEBYTECODE=1. A variable your tests need goes in the
  # command itself: `FOO=bar python3 -m pytest -q`. Never put a secret here.
  # Empty = detect: `python3 -m pytest -q` for a Python project with test
  # files, `npm test` for a package.json with a real `test` script. Nothing
  # detected, or both, means no PR: a sweep that cannot test opens nothing.
  test_command: ""
  # A run past this is killed (its whole process group) and counted as red.
  # 1 to 86400 seconds.
  test_timeout_seconds: 600
  # On red, fixes are dropped until the rest is green. This caps the test
  # runs per sweep, the full run and the base run included; 12 always finds
  # one bad fix among max_files_per_pr (20). It needs about
  # 2 + 2*ceil(log2(max_files_per_pr)), so raise it if you raise
  # max_files_per_pr. What is untested is dropped.
  max_test_runs: 12

promotion:
  # A principle fixed this many times inside window_days becomes a candidate to
  # be promoted into a mechanical rule.
  fix_threshold: 3
  window_days: 90

filing:
  # auto = file to beads when `bd` is present.
  beads: auto
  # Off by default. Mirroring findings as GitHub issues earns its keep on a
  # popular repo where outside contributors want visibility; on a repo only you
  # read, it is a second copy of the bead for an audience of one.
  github: false
  labels:
    - curamoir
    - curamoir:review
  # Cap per run, so one noisy review cannot flood you. The overflow is
  # summarised in a single issue rather than dropped.
  max_per_run: 15

guardrails:
  # never = cúramóir will not write to your default branch under any
  # circumstance. Enforced in code, not in a prompt.
  default_branch_writes: never
  branch_prefix: "curamoir/"
  command_denylist: default
  use_dcg_if_present: true

handoff:
  # Budget for the state injected at session start. Claude Code hard-limits the
  # injection to 10,000 characters; ~4 characters per token is the usual
  # approximation, so this is bounded by both.
  session_start_token_budget: 1500
  # Dated handoffs kept in .curamoir/handoff/history/.
  keep_history: 10
  # Days away before a brief is generated, when cadence.brief is on_return.
  brief_threshold_days: 5

rules:
  # ast-grep patterns survive reformatting and can match a proposed edit before
  # it reaches disk, which is what makes a guard possible. regex is the escape
  # hatch for things no AST pattern can express, such as file naming.
  matcher: ast-grep
  # curamoir-lint exits non-zero on any violation at or above this severity
  # (info < warning < error). Lower it to make warnings fail CI and pre-commit;
  # `curamoir-lint --fail-on` overrides it for one run.
  fail_on: error

smoke:
  # Run in a clean container on a cadence, so a broken quickstart is caught
  # before an evaluator finds it.
  command: "bash scripts/quickstart.sh"
  container: "python:3.12-slim"
